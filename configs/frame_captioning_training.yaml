

num_frames: 32
frame_sampling: uniform
frame_encoder: clip_vitb16
clip_path: checkpoints/clip/ViT-B-16.pt
max_t_len: 77
image_size: [224, 224]

freeze_frame_encoder: true     

training:
  epochs: 20
  batch_size: 8
  lr: 1.0e-4
  lr_pretrained_embeddings: 1.0e-5   
  label_smoothing: 0.1
  seed: 0
  log_every_steps: 50
  eval_every_steps: null             
  overfit_videos: 16                 
  save_epochs: [5, 10, 20]           
  num_workers: 0

data:
  train_annotation: data/CapERA/captions_train.json
  val_annotation: data/CapERA/captions_val.json
  train_video_root: datasets/CapERA/videos/Videos/Tra
  test_video_root: datasets/CapERA/videos/Videos/Test
  features_dir: features/frame_cocap/clip_vitb16  

output_dir: experiments/frame_cocap
